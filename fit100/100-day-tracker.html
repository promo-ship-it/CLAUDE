<style>
:root{--bg:#f6f4ef;--fg:#1d2127;--mut:#6b737d;--card:#fff;--ac:#1f8a7e;--ln:#e3dfd6;--acfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--fg:#f2efe8;--mut:#9aa3ad;--card:#1c222b;--ac:#5ec2b7;--ln:#2c343f;--acfg:#10201e}}
:root[data-theme="dark"]{--bg:#12161c;--fg:#f2efe8;--mut:#9aa3ad;--card:#1c222b;--ac:#5ec2b7;--ln:#2c343f;--acfg:#10201e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,"Helvetica Neue",Arial,sans-serif}
header{padding:16px 16px 8px}h1{font-size:22px;margin:0}#tot{color:var(--mut);font-size:14px}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
#tabs button{flex:none;min-width:44px;height:40px;border:1px solid var(--ln);border-radius:20px;background:var(--card);color:var(--fg);font-size:15px;padding:0 12px}
#tabs button.on{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:700}
main{padding:8px 16px 40px;max-width:640px;margin:0 auto}
.card,details.day{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:10px 0}
h2{font-size:18px;margin:0 0 2px}.mut,.tg{color:var(--mut);font-size:14px}.sw{color:var(--mut);font-size:13px}
summary{cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:8px}summary b{color:var(--ac)}
.ex{border-top:1px solid var(--ln);padding:10px 0 4px;margin-top:8px}.nm{font-weight:600}.ex a{text-decoration:none;margin-left:6px;color:var(--ac)}
.set{display:flex;align-items:center;gap:6px;margin:6px 0}.set label{flex:1;display:flex;align-items:center;gap:10px;min-height:36px}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--ac)}
input.n{width:62px;height:38px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--fg);font-size:16px;padding:0 8px}
.pk{width:34px;height:38px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ac);font-size:16px;padding:0}
.row{display:flex;align-items:center;gap:10px;min-height:40px;font-weight:600}ol{margin:6px 0;padding-left:20px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.bt{border:1px solid var(--ln);background:var(--bg);color:var(--fg);border-radius:18px;height:36px;padding:0 12px;font-size:14px}
.bt.danger{color:#d9534f;border-color:#d9534f}
.bar{height:10px;background:var(--ln);border-radius:5px;overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%;background:var(--ac)}
.sc{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-top:6px}.big{font-size:44px;font-weight:700;color:var(--ac);line-height:1.1}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}#sh[hidden]{display:none}
#shc{background:var(--card);width:100%;max-height:60vh;border-radius:16px 16px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}#lst{overflow-y:auto;scroll-snap-type:y proximity}
#lst button{display:block;width:100%;height:44px;border:0;background:none;color:var(--fg);font-size:18px;scroll-snap-align:center}#lst .sel{background:var(--ac);color:var(--acfg);border-radius:8px;font-weight:700}
#ed{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end}#ed[hidden]{display:none}#edc{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;max-height:90vh;overflow-y:auto}.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);flex:1}.fl input,.fl select{height:40px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--fg);font-size:16px;padding:0 8px}.fr{display:flex;gap:8px}

 M.arch.slice().reverse().forEach(a=>{h+=`<details class='card'><summary><span>Plan ${a.run} · ${a.start} to ${a.end}</span><b>${a.pc}%</b></summary><div class='sc'><span>Full / partial / missed</span><b>${a.F} / ${a.P} / ${a.X}</b></div><div class='sc'><span>Strength sessions</span><b>${a.sf} of ${a.sn}</b></div><div class='sc'><span>Sets checked</span><b>${a.ss}</b></div><div class='sc'><span>Volume (lb × reps)</span><b>${a.vol.toLocaleString()}</b></div>${a.nd!=null?`<div class='sc'><span>Nutrition days on plan</span><b>${a.no} of ${a.nd} logged</b></div><div class='sc'><span>Junk servings</span><b>${a.nt.junk}</b></div>`:''}<h2 style='margin-top:10px'>Best lifts</h2>${a.best.map(b=>`<div class='sc'><span>${esc(b[0])}</span><b>${b[1][0]} lb × ${b[1][1]}</b></div>`).join('')||'<div class="sw">None logged</div>'}<h2 style='margin-top:10px'>By week</h2>${weekRows(a.weeks)}</details>`});
 h+=`<details class='card'><summary>If you miss days or cut a workout short</summary><ol><li>Can’t train: tap Skip day, add a day. That workout moves to the next date and everything after shifts by one day.</li><li>Missed one strength day: do it on the next recovery or rest day if that’s within 2 days. Never double up.</li><li>Missed 3–6 days: repeat the last week you finished once, at the same weights.</li><li>Missed 7–14 days: restart at the last week you completed with about 10% less weight.</li><li>Off 3+ weeks: restart at the first week of your current phase at about 80% of your weights.</li><li>Short on time: do the first 2–3 exercises at full sets and drop the rest. Keep a 5-minute rehab minimum (Spanish squat hold, terminal knee extension, band external rotation), then tap Mark day complete.</li><li>Flare-up: use the swap and check the set. That doesn’t count as a miss.</li></ol></details>`;
 h+=`<div class='card'><h2>Start date</h2><p class='sw'>The date Day 1 falls on. Every day’s date is counted from here, so changing it shifts the whole calendar. Your logged sets stay attached to the same day number.</p><div class='set'><label style='gap:6px'><span>Day 1</span></label><input class='n' style='width:150px' type='date' id='sd' value='${M.starts[M.run]}'><button class='bt' id='sdt'>Start today</button></div></div>`;
 h+=`<div class='card'><h2>Reset program</h2><p class='sw'>Clears this plan’s logged sets, skipped days and exercise edits, and restarts at Day 1 today. Saved past plans are kept.</p><button class='bt' id='rst'>${armR?'Tap again to confirm reset':'Reset to Day 1'}</button></div>`;
 $('m').innerHTML=h}
function finish(){const o=stats(),best=Object.entries(o.best).sort((a,b)=>b[1][0]-a[1][0]).slice(0,10);
 M.arch.push({run:M.run,start:M.starts[M.run],end:iso(new Date()),pc:o.pc,F:o.F,P:o.P,X:o.X,sf:o.sf,sn:o.sn,rd:o.rd,ss:o.ss,vol:Math.round(o.vol),weeks:o.weeks,best,nd:o.nd,no:o.no,nt:o.nt});
 M.run++;M.starts[M.run]=iso(new Date());M.slips={};M.edits={};arm=false;cur=1;saveM();loadAll().then(render)}
function sheet(kind,key){SK=key;const v0=document.querySelector(`input[data-k='${key}']`).value,vals=[];
 if(kind==='w'){for(let v=0;v<=300;v+=2.5)vals.push(v)}else{for(let v=1;v<=40;v++)vals.push(v)}
 $('lst').innerHTML=vals.map(v=>`<button data-v='${v}' class='${String(v)===v0?'sel':''}'>${v}${kind==='w'?' lb':''}</button>`).join('');
 $('sht').textContent=kind==='w'?'Select weight':'Select reps';$('sh').hidden=false;
 ($('lst').querySelector('.sel')||$('lst').children[kind==='w'?8:7]).scrollIntoView({block:'center'})}
let EK=null;
function openEd(di,ei){EK={key:cur+'|'+di,di,ei};const e=ei>=0?exs(cur,di)[ei]:{n:'',s:3,r:'10',k:'s',nt:''};
 $('e1').value=e.n;$('e2').value=e.s;$('e3').value=e.r;$('e4').value=e.k;$('e5').value=e.nt||'';$('edd').style.display=ei>=0?'':'none';$('edt').textContent=ei>=0?'Edit exercise':'Add exercise';$('ed').hidden=false}
function saveEd(){const n=$('e1').value.trim();if(!n)return;const base=exs(cur,EK.di).map(x=>Object.assign({},x));
 const e={n,s:Math.max(1,Math.min(10,parseInt($('e2').value)||1)),r:$('e3').value.trim()||'-',sw:'',k:$('e4').value,nt:$('e5').value.trim()};
 if(EK.ei>=0){e.sw=base[EK.ei].sw||'';base[EK.ei]=e}else base.push(e);M.edits[EK.key]=base;saveM();$('ed').hidden=true;render()}
function delEd(){const base=exs(cur,EK.di).map(x=>Object.assign({},x));base[EK.ei].x=1;M.edits[EK.key]=base;saveM();$('ed').hidden=true;render()}
function clearDay(di){const st=S[cur]||{};Object.keys(st).forEach(key=>{if(key.split('|')[0]===String(di))delete st[key]});saveW(cur);armC=null;render()}
function setStart(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return;const[y,m,d]=v.split('-').map(Number),dt=new Date(y,m-1,d);if(isNaN(dt))return;M.starts[M.run]=iso(dt);saveM();render()}
function resetPlan(){armR=false;M.slips={};M.edits={};M.starts[M.run]=iso(new Date());D.forEach(x=>{S[x.w]={};wr(docId(x.w),lsK(x.w),{})});cur=1;saveM();render()}
function act(a,di){if(a==='edit'){const[x,y]=di.split('|');return openEd(+x,+y)}if(a==='add')return openEd(+di,-1);const key=cur+'|'+di,st=S[cur];
 if(a==='clear'){if(armC!==key){armC=key;return render()}return clearDay(+di)}
 if(a==='slip')M.slips[key]=(M.slips[key]||0)+1;
 else if(a==='unslip'){M.slips[key]=Math.max(0,(M.slips[key]||0)-1);if(!M.slips[key])delete M.slips[key]}
 else{st[di+'|done']=st[di+'|done']?0:1;saveW(cur)}
 armC=null;saveM();render()}
document.addEventListener('click',e=>{const t=e.target;
 const tb=t.closest('#tabs button');if(tb){cur=+tb.dataset.w;arm=false;armR=false;armC=null;scrollTo(0,0);return render()}
 const nb=t.closest('[data-a=nut]');if(nb)return nut(nb.dataset.k);const tb2=t.closest('[data-a=tg]');if(tb2)return tg(tb2.dataset.k);const pk=t.closest('.pk[data-p]');if(pk)return sheet(pk.dataset.p,pk.dataset.k);
 const op=t.closest('#lst button');if(op){const i=document.querySelector(`input[data-k='${SK}']`);i.value=op.dataset.v;S[cur][SK]=op.dataset.v;saveW(cur);$('sh').hidden=true;return prog()}
 if(t.id==='shx'||t.id==='sh'){$('sh').hidden=true;return}
 if(t.id==='edx'||t.id==='ed'){$('ed').hidden=true;return}if(t.id==='eds')return saveEd();if(t.id==='edd')return delEd();
 const bt=t.closest('.bt[data-a]');if(bt)return act(bt.dataset.a,bt.dataset.k);
 if(t.id==='fin'){if(!arm){arm=true;return score()}finish()}
 if(t.id==='rst'){if(!armR){armR=true;return score()}resetPlan()}
 if(t.id==='sdt')return setStart(iso(new Date()))});
document.addEventListener('input',e=>{if(e.target.id==='sd')return setStart(e.target.value);const k=e.target.dataset&&e.target.dataset.k;if(!k||cur===0)return;S[cur][k]=e.target.type==='checkbox'?(e.target.checked?1:0):e.target.value;saveW(cur);prog()});
(async()=>{try{if(window.claude&&claude.use){const[d,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(d&&u){const id=await u.id();if(id)DB=d.collection('data/users/'+id)}}}catch(e){}
 const m=await rd('meta','fp100-meta');if(m)M=Object.assign(M,m);M.edits=M.edits||{};M.tg=Object.assign({water:8,protein:4,fat:3,carb:3,junk:0},M.tg||{});await loadAll();render()})();
</script></body></html>
